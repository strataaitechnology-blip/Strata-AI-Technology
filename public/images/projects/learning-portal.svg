  <rect x="132" y="598" width="250" height="8" rx="4" fill="#1e3a56"/>
  <rect x="132" y="598" width="180" height="8" rx="4" fill="#2bae9a" fill-opacity="0.7"/>

  <rect x="426" y="534" width="324" height="90" rx="8" fill="#0d2952" stroke="#1e3a56" stroke-width="1.5"/>
  <rect x="448" y="554" width="80" height="7" rx="4" fill="#94a3b8" fill-opacity="0.5"/>
  <rect x="448" y="572" width="140" height="14" rx="4" fill="#e8f0f8" fill-opacity="0.9"/>
  <rect x="448" y="598" width="280" height="8" rx="4" fill="#1e3a56"/>
  <rect x="448" y="598" width="80" height="8" rx="4" fill="#2bae9a" fill-opacity="0.5"/>

  <text x="48" y="764" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ecab8" fill-opacity="0.5">Placeholder preview</text>
</svg>
