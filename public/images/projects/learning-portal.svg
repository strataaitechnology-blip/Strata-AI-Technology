  <rect x="828" y="448" width="100" height="5" rx="2" fill="#94a3b8" fill-opacity="0.25"/>

  <!-- Module 5 -->
  <rect x="786" y="482" width="284" height="56" rx="6" fill="#0d1e32" stroke="#1e3a56" stroke-width="1"/>
  <rect x="804" y="500" width="14" height="14" rx="7" fill="#1e3a56"/>
  <rect x="828" y="500" width="180" height="7" rx="3" fill="#e8f0f8" fill-opacity="0.5"/>
  <rect x="828" y="516" width="100" height="5" rx="2" fill="#94a3b8" fill-opacity="0.2"/>

