<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <defs>
    <linearGradient id="bg-lp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1929"/><stop offset="1" stop-color="#142d4e"/>
    </linearGradient>
    <pattern id="gr-lp" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#2bae9a" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-lp)"/>
  <rect width="1200" height="800" fill="url(#gr-lp)"/>

  <!-- Top nav bar -->
